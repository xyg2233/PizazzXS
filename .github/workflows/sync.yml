name: Sync from GitHub潇洒仓库 with Smart Backup

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */1 * * *' # 每小时运行一次，可根据需要调整

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. 初始化与下载 (已替换为你的OSS地址)
      # ==========================================
      - name: Checkout Self (Clean)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 必须拉取完整历史，否则无法提交

      - name: Download Files from OSS
        run: |
          echo "📥 开始从OSS下载更新..."
          # 创建本地目录
          mkdir -p local
          
          # 下载单线路和多线路 (使用 -f 参数：文件存在则覆盖，不存在则创建)
          # 注意：如果下载失败，脚本会停止，避免备份旧数据
          wget -q -f "https://oss-v1.wangmeipo.cn/236/单线路.zip" -O local/单线路.zip
          echo "✅ 单线路.zip 下载完成"
          
          wget -q -f "https://oss-v1.wangmeipo.cn/236/多线路.zip" -O local/多线路.zip
          echo "✅ 多线路.zip 下载完成"

      # ==========================================
      # 2. 智能原子化备份 (核心逻辑)
      # ==========================================
      - name: Smart Atomic Backup
        run: |
          set -e # 遇到错误立即退出
          
          BACKUP_DIR="历史线路包"
          mkdir -p "$BACKUP_DIR"
          
          # 定义备份函数
          backup_file() {
            local SRC_FILE="$1"
            local BASE_NAME=$(basename "$SRC_FILE" .zip)
            local DATE_SUFFIX=$(date +%m%d)
            local CURRENT_HASH=$(sha256sum "$SRC_FILE" | awk '{print $1}')
            
            # 1. 读取旧哈希
            local OLD_HASH=""
            if [ -f "$BACKUP_DIR/last_hashes.txt" ]; then
              OLD_HASH=$(grep "^$BASE_NAME:" "$BACKUP_DIR/last_hashes.txt" | cut -d: -f2)
            fi

            # 2. 判断是否需要备份
            if [ "$CURRENT_HASH" == "$OLD_HASH" ]; then
              echo "⏭️ 文件无变化，跳过备份: $BASE_NAME"
              return 0
            fi

            echo "🔄 检测到文件更新，开始备份流程..."
            
            # 3. 计算版本号 (避免覆盖)
            local version=0
            # 查找今天已有的备份文件，提取最大版本号
            # 注意：这里使用 find 配合 while read 完美支持中文路径
            while IFS= read -r -d '' file; do
              if [[ $(basename "$file") =~ ^${BASE_NAME}_${DATE_SUFFIX}(.([0-9]+))?.zip$ ]]; then
                local v="${BASH_REMATCH[2]:-0}"
                if [ "$v" -gt "$version" ]; then version="$v"; fi
              fi
            done < <(find "$BACKUP_DIR" -maxdepth 1 -name "${BASE_NAME}_${DATE_SUFFIX}*.zip" -print0)
            
            version=$((version + 1))
            
            # 4. 生成新文件名
            local NEW_NAME
            if [ "$version" -eq 1 ]; then
              NEW_NAME="${BASE_NAME}_${DATE_SUFFIX}.zip"
            else
              NEW_NAME="${BASE_NAME}_${DATE_SUFFIX}.${version}.zip"
            fi

            # 5. 执行原子写入 (先写临时文件，校验后移动)
            local TEMP_FILE="$BACKUP_DIR/.${NEW_NAME}.tmp"
            cp "$SRC_FILE" "$TEMP_FILE"
            
            # 双重校验哈希，确保写入无误
            local TEMP_HASH=$(sha256sum "$TEMP_FILE" | awk '{print $1}')
            if [ "$TEMP_HASH" != "$CURRENT_HASH" ]; then
              echo "❌ 哈希校验失败，备份中止"
              rm -f "$TEMP_FILE"
              exit 1
            fi
            
            mv "$TEMP_FILE" "$BACKUP_DIR/$NEW_NAME"
            echo "💾 已备份为: $NEW_NAME"

            # 6. 更新哈希记录
            grep -v "^$BASE_NAME:" "$BACKUP_DIR/last_hashes.txt" > "$BACKUP_DIR/last_hashes.txt.tmp" || true
            echo "$BASE_NAME:$CURRENT_HASH" >> "$BACKUP_DIR/last_hashes.txt.tmp"
            mv "$BACKUP_DIR/last_hashes.txt.tmp" "$BACKUP_DIR/last_hashes.txt"
          }

          # 执行备份
          backup_file "local/单线路.zip"
          backup_file "local/多线路.zip"

      # ==========================================
      # 3. 自动解压与提交
      # ==========================================
      - name: Auto Extract ZIP
        run: |
          echo "📂 开始解压单线路..."
          mkdir -p 单线路文件
          # 使用 -o 强制覆盖， -q 静默模式
          unzip -o -q local/单线路.zip -d 单线路文件/
          echo "✅ 解压完成"

      - name: Commit and Push
        run: |
          # 设置 Git 身份
          git config --global user.name "潇洒同步机器人"
          git config --global user.email "潇洒@example.com"
          
          # 强制添加所有变更（包括被修改的zip和被覆盖的解压文件）
          # 使用 git add -f 确保即使文件被 gitignore 也能加入
          git add -f 历史线路包/ 单线路文件/ local/
          
          # 检查是否有变更
          if ! git diff-index --quiet HEAD --; then
            echo "🚀 检测到仓库变更，正在提交..."
            git commit -m "auto: 数据同步更新 [$(date +'%m-%d %H:%M')] [skip ci]"
            
            # 强制推送到覆盖 origin/master
            git push --force origin HEAD:master
          else
            echo "✨ 本地数据与远端一致，无需提交。"
          fi

      # ==========================================
      # 4. 存储报告 (保留原样)
      # ==========================================
      - name: Generate Storage Report
        if: github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get update -qq && sudo apt-get install -qqy jq bc > /dev/null
          
          STORAGE_USED_KB=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}" | jq -r '.size')
          STORAGE_QUOTA_GB=1.0
          STORAGE_QUOTA_MB=$(echo "$STORAGE_QUOTA_GB * 1024" | bc)
          STORAGE_USED_MB=$(echo "scale=2; $STORAGE_USED_KB / 1024" | bc)
          REMAINING_MB=$(echo "scale=2; $STORAGE_QUOTA_MB - $STORAGE_USED_MB" | bc)
          if (( $(echo "$REMAINING_MB < 0" | bc -l) )); then REMAINING_MB=0.00; fi
          
          STORAGE_PERCENT=$(echo "scale=3; ($STORAGE_USED_MB / $STORAGE_QUOTA_MB) * 100" | bc)
          STORAGE_PERCENT=$(printf "%.1f" "$STORAGE_PERCENT")

          PROGRESS_BAR=""
          for i in {1..20}; do
            THRESHOLD=$(echo "scale=1; $i * 5" | bc)
            if (( $(echo "$STORAGE_PERCENT >= $THRESHOLD" | bc -l) )); then
              PROGRESS_BAR+="▓"
            else
              PROGRESS_BAR+="░"
            fi
          done

          BACKUP_COUNT=$(ls -1 历史线路包/*.zip 2>/dev/null | wc -l)
          LATEST_BACKUP=$(ls -1t 历史线路包/*.zip 2>/dev/null | head -n1 | xargs basename 2>/dev/null || echo "无")
          BACKUP_SIZE=$(du -sh 历史线路包 2>/dev/null | cut -f1)

          REPORT_CONTENT=$(cat <<-EOF
          ## 📊 仓库存储分析报告
          **生成时间:** $(date +'%Y-%m-%d %H:%M:%S %Z')  
          **工作流ID:** [\$GITHUB_RUN_ID](https://github.com/\${{ github.repository }}/actions/runs/\$GITHUB_RUN_ID)

          ### 🗃️ 存储使用情况
          | 项目         | 详情                          |
          |--------------|-------------------------------|
          | **总配额**   | \${STORAGE_QUOTA_GB} GB       |
          | **已使用**   | \${STORAGE_USED_MB} MB (\${STORAGE_PERCENT}%) |
          | **进度条**   | \`\${PROGRESS_BAR}\`                |
          | **剩余空间** | \${REMAINING_MB} MB            |

          ### 📦 备份状态
          | 项目         | 详情                          |
          |--------------|-------------------------------|
          | 备份目录     | \`历史线路包\`                   |
          | 备份文件数   | \${BACKUP_COUNT} 个             |
          | 最新备份     | \`\${LATEST_BACKUP}\`            |
          | 备份总大小   | \${BACKUP_SIZE}                |
          EOF
          )

          curl -s -X POST \
            -H "Authorization: token \${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/\${{ github.repository }}/issues" \
            -d "$(jq -n --arg title "📦[存储报告] \$(date +'%m-%d %H:%M')" --arg body "\$REPORT_CONTENT" '{"title":\$title,"body":\$body}')"
