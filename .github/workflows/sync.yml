name: Sync from GitHub潇洒仓库 with Smart Backup (Beijing Time)
on:
  schedule:
    - cron: '0 * * * *'  # 每小时执行一次（UTC时间）
  workflow_dispatch:     # 支持手动触发

env:
  TZ: Asia/Shanghai      # 强制使用北京时间

permissions:
  issues: write
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # ====================== 核心功能步骤（未修改）======================
      - name: Set Beijing Timezone
        run: |
          sudo timedatectl set-timezone Asia/Shanghai
          echo "当前时间: $(date +'%Y-%m-%d %H:%M:%S %Z')"

      - name: Checkout GitHub Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize Environment
        run: |
          mkdir -p 历史线路包
          # 【仅修改这里：强制重建last_hashes.txt，删了也不怕】
          touch 历史线路包/last_hashes.txt
          chmod 644 历史线路包/last_hashes.txt
          echo "初始化完成 [$(date +'%H:%M:%S')]"

      - name: Backup Workflow File
        run: |
          cp .github/workflows/sync.yml /tmp/sync.yml
          echo "工作流备份完成 [$(date +'%H:%M:%S')]"

      - name: Protect Backup Directory
        run: |
          if [ -d "历史线路包" ]; then
            mv 历史线路包 /tmp/history_backup
            echo "备份目录保护完成 [$(date +'%H:%M:%S')]"
          fi

      # ====================== 【仅修改这里】删掉旧GitHub同步步骤 ======================
      # 旧仓库会删除local文件夹，完全没用，直接删掉
      # ==========================================================================

      # ====================== 【仅修改这里】换成你要的OSS下载地址 ======================
      - name: Download from OSS
        run: |
          mkdir -p local
          # 加-f参数：下载失败直接报错，不偷偷跳过
          curl -Lf -o local/单线路.zip https://oss-v1.wangmeipo.cn/236/单线路.zip
          curl -Lf -o local/多线路.zip https://oss-v1.wangmeipo.cn/236/多线路.zip
          echo "下载完成 [$(date +'%H:%M:%S')]"
      # ==============================================================================

      - name: Restore Backup Directory
        run: |
          if [ -d "/tmp/history_backup" ]; then
            mv /tmp/history_backup 历史线路包
            chmod 644 历史线路包/last_hashes.txt
            echo "备份目录恢复完成 [$(date +'%H:%M:%S')]"
          fi

      - name: Restore Workflow File
        run: |
          mkdir -p .github/workflows
          cp /tmp/sync.yml .github/workflows/sync.yml
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .github/workflows/sync.yml
          git commit -m "同步后恢复工作流文件 [$(date +'%m-%d %H:%M')]" || echo "无变更可提交"
          echo "工作流恢复完成 [$(date +'%H:%M:%S')]"

      - name: Smart Atomic Backup  # 核心备份逻辑（完全未修改）
        run: |
          #!/bin/bash
          set -eo pipefail
          SRC_FILE="local/单线路.zip"
          BACKUP_DIR="历史线路包"
          BASE_NAME="单线路"
          DATE_SUFFIX=$(date +"%y.%m.%d")
          MAX_RETRIES=3
          RETRY_DELAY=5

          atomic_backup_with_retry() {
            local attempt=1
            while [ $attempt -le $MAX_RETRIES ]; do
              echo "[尝试 $attempt/$MAX_RETRIES] $(date +'%H:%M:%S')"
              if atomic_backup; then
                return 0
              fi
              sleep $RETRY_DELAY
              ((attempt++))
            done
            echo "::error::达到最大重试次数 [$(date +'%H:%M:%S')]"
            return 1
          }

          atomic_backup() {
            exec 9>"$BACKUP_DIR/.lock"
            if ! flock -x -w 15 9; then
              echo "::error::无法获取文件锁 [$(date +'%H:%M:%S')]"
              return 1
            fi

            if [ ! -f "$SRC_FILE" ]; then
              echo "::warning::源文件不存在 [$(date +'%H:%M:%S')]"
              return 0
            fi
            
            CURRENT_HASH=$(sha256sum "$SRC_FILE" | awk '{print $1}')
            echo "当前文件哈希: ${CURRENT_HASH:0:8}... [$(date +'%H:%M:%S')]"

            if [ -f "$BACKUP_DIR/last_hashes.txt" ]; then
              OLD_HASH=$(grep "^$BASE_NAME:" "$BACKUP_DIR/last_hashes.txt" | cut -d: -f2 || echo "")
              if [ "$CURRENT_HASH" == "$OLD_HASH" ]; then
                echo "::notice::文件无变化，跳过备份 [$(date +'%H:%M:%S')]"
                return 0
              fi
              
              while IFS= read -r -d '' backup_file; do
                BACKUP_HASH=$(sha256sum "$backup_file" | awk '{print $1}')
                if [ "$BACKUP_HASH" == "$CURRENT_HASH" ]; then
                  echo "::notice::发现相同备份: $(basename "$backup_file") [$(date +'%H:%M:%S')]"
                  TEMP_HASHFILE=$(mktemp)
                  grep -v "^$BASE_NAME:" "$BACKUP_DIR/last_hashes.txt" > "$TEMP_HASHFILE" 2>/dev/null || true
                  echo "$BASE_NAME:$CURRENT_HASH" >> "$TEMP_HASHFILE"
                  mv "$TEMP_HASHFILE" "$BACKUP_DIR/last_hashes.txt"
                  return 0
                fi
              done < <(find "$BACKUP_DIR" -name "${BASE_NAME}*.zip" -print0)
            fi

            TEMP_DIR=$(mktemp -d)
            trap 'rm -rf "$TEMP_DIR"' EXIT

            get_next_version() {
              local files=()
              while IFS= read -r -d '' file; do
                files+=("$file")
              done < <(find "$BACKUP_DIR" -name "${BASE_NAME}${DATE_SUFFIX}*.zip" -print0 | sort -zV)
              
              if [ ${#files[@]} -eq 0 ]; then
                echo "0"
              else
                local latest_file="${files[-1]"
                if [[ "$latest_file" =~ ${BASE_NAME}${DATE_SUFFIX}(\.([0-9]+))?\.zip$ ]]; then
                  local current_ver="${BASH_REMATCH[2]:-0}"
                  echo "$((current_ver + 1))"
                else
                  echo "1"
                fi
              fi
            }

            local version=$(get_next_version)
            local backup_name
            if [ "$version" -eq 0 ]; then
              backup_name="${BASE_NAME}${DATE_SUFFIX}.zip"
            else
              backup_name="${BASE_NAME}${DATE_SUFFIX}.${version}.zip"
            fi

            (
              set -e
              TEMP_FILE="$TEMP_DIR/${backup_name}.tmp"
              echo "创建临时备份文件: $backup_name [$(date +'%H:%M:%S')]"
              cp "$SRC_FILE" "$TEMP_FILE"

              TEMP_HASH=$(sha256sum "$TEMP_FILE" | awk '{print $1}')
              if [ "$TEMP_HASH" != "$CURRENT_HASH" ]; then
                echo "::error::哈希校验失败 [$(date +'%H:%M:%S')]"
                exit 1
              fi

              mv "$TEMP_FILE" "$BACKUP_DIR/$backup_name"
              TEMP_HASHFILE="$TEMP_DIR/last_hashes.tmp"
              grep -v "^$BASE_NAME:" "$BACKUP_DIR/last_hashes.txt" > "$TEMP_HASHFILE" 2>/dev/null || true
              echo "$BASE_NAME:$CURRENT_HASH" >> "$TEMP_HASHFILE"
              mv "$TEMP_HASHFILE" "$BACKUP_DIR/last_hashes.txt"
            ) || {
              echo "::error::备份过程失败 [$(date +'%H:%M:%S')]"
              return 1
            }

            echo "::notice::备份成功: $backup_name [$(date +'%H:%M:%S')]"
            return 0
          }

          atomic_backup_with_retry

      - name: Auto Extract ZIP  # 解压逻辑（完全未修改）
        run: |
          if [ -f "local/单线路.zip" ]; then
            echo "开始解压 [$(date +'%H:%M:%S')]"
            mkdir -p 单线路文件/
            if ! unzip -o -q local/单线路.zip -d 单线路文件/; then
              echo "::error::解压失败 [$(date +'%H:%M:%S')]"
              exit 1
            fi
            echo "解压完成 → 单线路文件/ [$(date +'%H:%M:%S')]"
          else
            echo "::notice::无ZIP文件可解压 [$(date +'%H:%M:%S')]"
          fi

      - name: Commit and Push  # 提交推送逻辑（完全未修改）
        run: |
          git add 历史线路包/ 单线路文件/ || echo "无文件变更"
          if ! git diff-index --quiet HEAD --; then
            git config --global user.name "GitHub Actions Bot"
            git config --global user.email "actions@github.com"
            git commit -m "自动备份 [$(date +'%m-%d %H:%M')] [skip ci]"
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git push --force origin HEAD:master
          else
            echo "::notice::无新变更，跳过推送"
          fi

      # ====================== 存储报告步骤（完全未修改）======================
      - name: Generate Storage Report
        if: github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get update -qq && sudo apt-get install -qqy jq bc > /dev/null

          # 获取存储数据
          STORAGE_USED_KB=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}" | jq -r '.size')
          STORAGE_QUOTA_GB=1.0  # 总配额1.0 GB
          STORAGE_QUOTA_MB=$(echo "$STORAGE_QUOTA_GB * 1024" | bc)  # 1GB=1024MB

          # 单位转换（已使用和剩余空间用MB）
          STORAGE_USED_MB=$(echo "scale=2; $STORAGE_USED_KB / 1024" | bc)
          REMAINING_MB=$(echo "scale=2; $STORAGE_QUOTA_MB - $STORAGE_USED_MB" | bc)
          if (( $(echo "$REMAINING_MB < 0" | bc -l) )); then REMAINING_MB=0.00; fi

          # 计算百分比
          STORAGE_PERCENT=$(echo "scale=3; ($STORAGE_USED_MB / $STORAGE_QUOTA_MB) * 100" | bc)
          STORAGE_PERCENT=$(printf "%.1f" "$STORAGE_PERCENT")

          # 进度条
          PROGRESS_BAR=""
          for i in {1..20}; do
            THRESHOLD=$(echo "scale=1; $i * 5" | bc)
            if (( $(echo "$STORAGE_PERCENT >= $THRESHOLD" | bc -l) )); then
              PROGRESS_BAR+="▓"
            else
              PROGRESS_BAR+="░"
            fi
          done

          # 备份统计
          BACKUP_COUNT=$(ls -1 历史线路包/*.zip 2>/dev/null | wc -l)
          LATEST_BACKUP=$(ls -1t 历史线路包/*.zip 2>/dev/null | head -n1 | xargs basename 2>/dev/null || echo "无")
          BACKUP_SIZE=$(du -sh 历史线路包 2>/dev/null | cut -f1)

          # 生成报告（标题格式：📦[存储报告] 月-日 时:分）
          REPORT_CONTENT=$(cat <<-EOF
          ## 📊 仓库存储分析报告
          **生成时间:** $(date +'%Y-%m-%d %H:%M:%S %Z')  
          **工作流ID:** [$GITHUB_RUN_ID](链接1$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)

          ### 🗃️ 存储使用情况
          | 项目         | 详情                          |
          |--------------|-------------------------------|
          | **总配额**   | ${STORAGE_QUOTA_GB} GB (GitHub免费账户) |
          | **已使用**   | ${STORAGE_USED_MB} MB (${STORAGE_PERCENT}%) |
          | **进度条**   | \`${PROGRESS_BAR}\`                |
          | **剩余空间** | ${REMAINING_MB} MB            |

          ### 📦 备份状态
          | 项目         | 详情                          |
          |--------------|-------------------------------|
          | 备份目录     | \`历史线路包\`                   |
          | 备份文件数   | ${BACKUP_COUNT} 个             |
          | 最新备份     | \`${LATEST_BACKUP}\`            |
          | 备份总大小   | ${BACKUP_SIZE}                |

          ### 📂 目录概览
          \`\`\`bash
          # 文件大小排行
          $(du -sh * | sort -hr | head -n20)
          \`\`\`
          EOF
          )

          # 创建Issue（标题格式：📦[存储报告] 月-日 时:分）
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d "$(jq -n --arg title "📦[存储报告] $(date +'%m-%d %H:%M')" --arg body "$REPORT_CONTENT" '{"title":$title,"body":$body}')"
